# The only flow that navigates by hand (tabs -> list -> row -> back):
# everything else enters via deep link on purpose (see
# subflows/smoke-demo.yaml). This covers what the deep link skips —
# CategoryListScreen, the category's FlatList and the "back" with dismissTo —
# without repeating it in the other 45 flows.
#
# Maestro's text selector requires a full string match, not a substring: each
# iOS tab exposes accessibilityText "Molecules, tab, 3 of 5" (not just
# "Molecules"), and a FlatList row concatenates title + description in a
# single accessible node ("Stepper, "-" + numeric input...").
# That's why below everything that isn't a screen's exact title uses
# `.*text.*` — and the "I got there" assertions are against the category
# header (standalone Title, not grouped), not against the row that was tapped.
#
# The first assert uses extendedWaitUntil precisely because here there's no
# `openLink` giving the bundle time to start (the other 45 flows go through
# subflows/smoke-demo.yaml, which does have it). With a bare assertVisible,
# on a cold start of a Release build the hierarchy is still empty when the
# assert runs and the flow fails intermittently against a blank screen.
appId: com.anonymous.orn-ui-example
tags:
  - smoke
---
- launchApp
- extendedWaitUntil:
    visible: "Atoms"
    timeout: 20000
- tapOn: ".*Molecules.*"
- assertVisible: "Molecules"
- tapOn: ".*Stepper.*"
- assertVisible: "Stepper"
- tapOn: "Back"
- assertVisible: "Molecules"
- tapOn: ".*Organisms.*"
- assertVisible: "Organisms"
- tapOn: ".*Examples.*"
- assertVisible: "Examples"
- tapOn: ".*Atoms.*"
- assertVisible: "Atoms"
