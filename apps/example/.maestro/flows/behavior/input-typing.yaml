# Each Input has TWO elements with the same text: the floating label's
# <Text> and the TextInput's own accessibilityLabel (both "Email") — see
# packages/ui/src/atoms/Input.tsx. tapOn by that text is ambiguous (2 matches),
# so here we tap the placeholder (unique) to focus, and "Show password" (the
# IconButton's own accessibilityLabel) for the toggle.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "atoms"
      SLUG: "input"
      TITLE: "Input"

- tapOn: "you@example.com"
- inputText: "hello@orn-ui.dev"
- assertVisible: "hello@orn-ui.dev"
- hideKeyboard

- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

# Password — the show/hide toggle is the only thing specific to this variant.
- tapOn: "Show password"
- assertVisible: "Hide password"
- tapOn: "Hide password"
- assertVisible: "Show password"
