# Specific regression: a measuring SafeAreaProvider that wrapped the content
# instead of floating apart sent the sheet to the top of the screen instead
# of anchoring it at the bottom (see commit "fix: prevent SafeAreaProvider
# from affecting BottomSheet layout"). An assertVisible by text wouldn't have
# caught it: the text was visible all the same, just in the wrong place.
#
# The `below: { point: "50%,50%" }` compares against the screen's midpoint,
# not against another text element: a native iOS <Modal> isolates its window
# from the rest of the app's accessibility tree while open (confirmed live —
# the demo's description, on the screen behind, stops existing for Maestro as
# soon as the backdrop rises), so any anchor "outside" the modal is
# unreachable. The midpoint does live in the same window as the sheet.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "bottom-sheet"
      TITLE: "BottomSheet"

- tapOn: "Open sheet"
# The handle is hidden from accessibility (decorative), so the sheet is
# located by its text.
- assertVisible:
    text: "Drag the handle down, or tap outside, to dismiss."
    below:
      point: "50%,50%"

# Dragging the handle down has to close the sheet. Explicit coordinates, not
# `direction: DOWN` with the default distance: in this variant (short
# content) the handle already lives near the bottom edge — the only way to
# guarantee DISMISS_THRESHOLD's >100pt is to start at the very top of the
# handle's hit area and release at the edge of the screen.
- swipe:
    start: "50%,86%"
    end: "50%,100%"
    duration: 400
- assertNotVisible: "Drag the handle down, or tap outside, to dismiss."

# Close by tapping the backdrop, the other way to close — relaunching the app
# instead of reopening the sheet on the same screen: XCUITest briefly reuses
# the stale reference of a testID that was just unmounted (seen live: the
# handle looks perfect in the screenshot and still "not found"), and a
# relaunch avoids fighting with that stale driver reference instead of with
# the component.
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "bottom-sheet"
      TITLE: "BottomSheet"
- tapOn: "Open sheet"
- assertVisible: "Drag the handle down, or tap outside, to dismiss."
- tapOn:
    id: "bottom-sheet-backdrop"
- assertNotVisible: "Drag the handle down, or tap outside, to dismiss."
