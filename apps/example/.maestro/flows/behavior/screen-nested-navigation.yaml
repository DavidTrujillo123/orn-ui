# Screen takes up the whole screen: inside VariantList's pager nothing it
# does is visible (see the comment in Screen.demo.tsx). Each variant opens a
# separate native <Modal> with the trigger — the generic smoke test (deep
# link + pager swipe) never taps that button, so it never gets to mount the
# real Screen or scroll its content.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "screen"
      TITLE: "Screen"

# 1st variant (index 0): edges={["top","bottom"]} — open and close the modal.
- tapOn: "Open with safe area"
- assertVisible: "The red bands are the safe-area insets. The title starts below the top one."
- tapOn: "Close"
- assertNotVisible: "The red bands are the safe-area insets. The title starts below the top one."

# 3rd variant (index 2): scrollable — long content goes into the scroller
# by default; block 8 doesn't fit on one screen without scrolling.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

- tapOn: "Open a long screen"
- assertVisible: "Block 1"
- scrollUntilVisible:
    element:
      text: "Block 8"
    direction: DOWN
- assertVisible: "Block 8"

# "Close" lives at the very top, before Block 1 — scrollUntilVisible to
# Block 8 left it off screen. Confirmed live.
- scrollUntilVisible:
    element:
      text: "Close"
    direction: UP
- tapOn: "Close"
