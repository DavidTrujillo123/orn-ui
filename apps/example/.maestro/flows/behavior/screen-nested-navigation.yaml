# Screen ocupa la pantalla entera: dentro del pager de VariantList no se ve
# nada de lo que hace (ver comentario de Screen.demo.tsx). Cada variante abre
# un <Modal> nativo aparte con el trigger — el smoke genérico (deep link +
# swipe del pager) nunca toca ese botón, así que nunca llega a montar el
# Screen real ni a scrollear su contenido.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "screen"
      TITLE: "Screen"

# Variant 1ro (index 0): edges={["top","bottom"]} — abrir y cerrar el modal.
- tapOn: "Open with safe area"
- assertVisible: "The red bands are the safe-area insets. The title starts below the top one."
- tapOn: "Close"
- assertNotVisible: "The red bands are the safe-area insets. The title starts below the top one."

# Variant 3ro (index 2): scrollable — contenido largo entra en el scroller
# por default; el bloque 8 no entra en una pantalla sin scrollear.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

- tapOn: "Open a long screen"
- assertVisible: "Block 1"
- scrollUntilVisible:
    element:
      text: "Block 8"
    direction: DOWN
- assertVisible: "Block 8"

# "Close" vive arriba del todo, antes del Block 1 — scrollUntilVisible a
# Block 8 lo dejó fuera de pantalla. Confirmado en vivo.
- scrollUntilVisible:
    element:
      text: "Close"
    direction: UP
- tapOn: "Close"
