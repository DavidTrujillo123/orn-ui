# Screen takes up the whole screen: inside VariantList's pager nothing it
# does is visible (see the comment in Screen.demo.tsx). Each variant opens a
# separate native <Modal> with the trigger — the generic smoke test (deep
# link + pager swipe) never taps that button, so it never gets to mount the
# real Screen or scroll its content.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "screen"
      TITLE: "Screen"

# 1st variant (index 0): edges={["top","bottom"]} — open and close the modal.
- tapOn: "Open a screen"
- assertVisible: ".*below the notch.*"
- tapOn: "Close"
- assertNotVisible: ".*below the notch.*"

- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

# header: the content scrolls, the header (and its close button) stays.
- tapOn: "Open with a header"
- assertVisible: ".*Block 1:.*"
- scrollUntilVisible:
    element:
      text: ".*Block 8:.*"
    direction: DOWN
- assertVisible: "Clients"
- tapOn: "Close"
- assertNotVisible: "Clients"
