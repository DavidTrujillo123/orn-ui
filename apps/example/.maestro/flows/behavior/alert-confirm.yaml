# The Alert's button ends up inside a single merged accessibility node
# ("Invoice sent, Close", with the whole backdrop's bounding box) — there's no
# way to tap it by text/id without ambiguity. It's tapped by coordinates,
# computed by reading the real pixels of a screenshot (not the already scaled
# screenshot the viewer shows), 50%,55% for this variant.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "alert"
      TITLE: "Alert"

- tapOn: "Show success"
- waitForAnimationToEnd
- assertVisible:
    text: ".*Invoice sent.*"
- tapOn:
    point: "50%,55%"
- assertNotVisible:
    text: ".*Invoice sent.*"
