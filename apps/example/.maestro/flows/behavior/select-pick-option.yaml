# Select's trigger duplicates the label as standalone text above (not
# interactive) AND as the real Pressable's accessibilityLabel — same pattern
# as Input. `index: 1` taps the second match (the Pressable); tapping without
# an index lands on the first (the <Text> above) and the dropdown doesn't
# even open — seen live with a screenshot: nothing happened.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "select"
      TITLE: "Select"

- tapOn:
    text: "Payment method"
    index: 1
- assertVisible:
    id: "select-list"
- tapOn: "Cash"
- assertNotVisible:
    id: "select-list"
