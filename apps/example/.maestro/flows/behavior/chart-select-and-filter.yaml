# What a render test can't see: Chart has no layout of its own until the
# device tells it how big it is. In jsdom the width is 0 and the component
# draws nothing; the test makes up for it by firing a `layout` by hand, which
# means it asserts on a made-up measurement. Here the measurement is real, and with it:
#
# - that the tap lands inside the band it belongs to (the bands are absolute
#   boxes spread over a width that only exists on screen),
# - that the series the tap picks is the one whose mark is closest to the
#   finger —that is decided with the touch coordinate, which jsdom doesn't produce—,
# - that changing the filter redraws the chart with other columns.
#
# The asserts look at the text echo the demo prints: the highlighted bar, the
# bubble and the animation are pixels, and an assert can't see them.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "chart"
      TITLE: "Chart"

# 1 — starts with nothing selected, with all six months.
- assertVisible: "Tap a month"
- assertVisible: "Jan"
- assertVisible: "Jun"

# 2 — tapping a band selects that month. The tap goes by `id`: the band is a
# transparent box over the column, it has no text to target.
- tapOn:
    id: "chart-interactive-band-1"
- waitForAnimationToEnd
- assertVisible: "Feb: .*"

# 3 — tapping the same spot again releases it. Without this there would be no
# way back to the whole chart without tapping outside.
- tapOn:
    id: "chart-interactive-band-1"
- waitForAnimationToEnd
- assertVisible: "Tap a month"

# 4 — the legend is the filter: turning off "Costs" removes that series from
# the chart, and with a single series on the tap can only land on it.
- tapOn:
    id: "chart-interactive-legend-costs"
- waitForAnimationToEnd
- tapOn:
    id: "chart-interactive-band-1"
- waitForAnimationToEnd
- assertVisible: "Feb: sales .*"

# 5 — the range filter trims the data and the chart redraws: the months that
# left no longer have a column or a label.
- tapOn:
    id: "chart-interactive-filter-range-3"
- waitForAnimationToEnd
- assertVisible: "Tap a month"
- assertVisible: "Jun"
- assertNotVisible: "Jan"

# 6 — and the trimmed chart keeps responding, with the bands reindexed.
- tapOn:
    id: "chart-interactive-band-0"
- waitForAnimationToEnd
- assertVisible: "Apr: sales .*"
