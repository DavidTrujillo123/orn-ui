# Each List state is its own variant of the demo: the numbered switcher on
# top of the fill-mode demo moves between them. "Refresh" isn't tested:
# RefreshControl is only visible while the user drags the native
# pull-to-refresh gesture — there's nothing stable for assertVisible to catch.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "list"
      TITLE: "List"

- assertVisible: "Item 1"

# EmptyState merges title + description into a single accessibility node
# ("No items, Try a different filter"): an exact match never fits; a regex does.
- tapOn: "5"
- assertVisible: ".*No items.*"
- assertNotVisible: "Item 1"

- tapOn: "2"
- assertVisible:
    id: "list-skeleton"
- assertNotVisible: "Item 1"

- tapOn: "1"
- assertVisible: "Item 1"
- assertNotVisible:
    id: "list-skeleton"

# Infinite scroll: reaching the end of the first page (15 items) loads the
# next one, so item 20 shows up.
- scrollUntilVisible:
    element: "Item 20"
    direction: DOWN
    timeout: 15000
