# The demo's SegmentedControl switches isLoading/isRefreshing/isLoadingMore
# "live" on the same List — a generic smoke test only sees the initial state
# (loaded) and never exercises the skeleton/empty path ListDemo exists to
# show. "Refresh" isn't tested: RefreshControl is only visible while the user
# is dragging the native pull-to-refresh gesture, not when isRefreshing is set
# through state — there's nothing stable for assertVisible to catch there.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "list"
      TITLE: "List"

- assertVisible: "Item 1"

# EmptyState merges title + description into a single accessibility node
# ("No items, Try a different filter" — confirmed live with the hierarchy
# dump) — same pattern as the merged Alert or the "Atoms, tab, 2 of 5" tabs
# documented in the README. An exact match never fits; a regex does.
- tapOn: "Empty"
- assertVisible: ".*No items.*"
- assertNotVisible: "Item 1"

- tapOn: "First load"
- assertVisible:
    id: "list-skeleton"
- assertNotVisible: "Item 1"

- tapOn: "Loaded"
- assertVisible: "Item 1"
- assertNotVisible:
    id: "list-skeleton"
