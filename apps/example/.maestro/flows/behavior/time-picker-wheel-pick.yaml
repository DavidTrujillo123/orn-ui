# Lo que un render test no puede ver: cada rueda es un ScrollView anidado
# adentro del pager vertical de VariantList, o sea dos scrolls verticales
# compitiendo por el mismo gesto. Jest dispara `momentumScrollEnd` a mano y
# nunca prueba que el dedo llegue a la rueda en vez de pasar la página. Tampoco
# ve el snap ni que la rueda deshabilitada siga quieta.
#
# Después de cada gesto se vuelve a afirmar una ancla de la propia variante
# (su etiqueta o el eco de abajo), porque si el pager se quedara con el swipe y
# pasara de página, el assertNotVisible del eco viejo también pasaría de prepo.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "time-picker"
      TITLE: "TimePicker"

# 1 — 24 h: la rueda de horas mueve la selección y el minuto queda.
- assertVisible: "Selected: 09:30"
- swipe:
    from:
      id: "time-24-hour-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "24-hour format (default)"
- assertNotVisible: "Selected: 09:30"
- assertVisible: "Selected: .*"

# 2 — 12 h: el mismo gesto en la rueda de horas y un toque en AM/PM.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Selected: 2:15 PM"
- tapOn: "AM"
- waitForAnimationToEnd
- assertVisible: "12-hour format with AM/PM"
- assertVisible: "Selected: 2:15 AM"

# 3 — minuteStep={5}: la rueda de minutos se mueve de a cinco.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Selected: 10:00"
- swipe:
    from:
      id: "time-step-minute-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "minuteStep={5}"
- assertNotVisible: "Selected: 10:00"
- assertVisible: "Selected: .*"

# 4 — bounds: la rueda sigue moviéndose dentro de 09:00–17:00.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Selected: 09:00"
- swipe:
    from:
      id: "time-bounded-hour-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "minTime / maxTime (09:00 to 17:00)"
- assertNotVisible: "Selected: 09:00"
- assertVisible: "Selected: .*"

# 5 — vacío: AM/PM está deshabilitado y la primera vuelta de rueda elige.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Selected: No time selected"
- assertVisible: "Not selected"
- tapOn: "AM"
- assertVisible: "Selected: No time selected"
- swipe:
    from:
      id: "time-empty-hour-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "empty state: no value until the first wheel move"
- assertNotVisible: "Selected: No time selected"
- assertVisible: "Selected: .*"

# 6 — deshabilitada: el mismo swipe no la mueve.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Selected: 18:45"
- swipe:
    from:
      id: "time-disabled-hour-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "disabled"
- assertVisible: "Selected: 18:45"
