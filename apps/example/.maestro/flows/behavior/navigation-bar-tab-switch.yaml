# TabbedScreen keeps the active tab in its own state (useState, not the
# demo's VariantList) — a generic smoke test opens the demo and never touches
# the bar, so onChange/activeKey never run. First variant (index 0, no
# swipe): "with the tab content".
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "navigation-bar"
      TITLE: "NavigationBar"

- assertVisible: "Everything that happened since your last visit."

- tapOn: "Search"
- assertVisible: "Search clients, invoices or payments."

- tapOn: "Alerts"
- assertVisible: "Three invoices are due this week."

- tapOn: "Home"
- assertVisible: "Everything that happened since your last visit."
