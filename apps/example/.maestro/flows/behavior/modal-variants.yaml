# Each example opens from its button and closes the way its variant offers.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "modal"
      TITLE: "Modal"

# full: the footer's Cancel closes it.
- tapOn: "Edit profile"
- assertVisible: "Name"
- tapOn: "Cancel"
- assertNotVisible: "Name"

- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

# overlay: a tap on the backdrop below the card closes it.
- tapOn: "What's new"
- assertVisible:
    id: "modal-backdrop"
- assertVisible: ".*remember the last payment method.*"
- tapOn:
    point: "50%,90%"
- assertNotVisible: ".*remember the last payment method.*"

- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

# fullScreen: the header's close button.
- tapOn: "Open terms"
- assertVisible: ".*native full-screen presentation.*"
- tapOn: "Close"
- assertNotVisible: ".*native full-screen presentation.*"
