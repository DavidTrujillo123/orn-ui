appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "molecules"
      SLUG: "segmented-control"
      TITLE: "SegmentedControl"

# The demo shows the control alone: the selected segment is checked through
# its accessibility state.
- assertVisible:
    text: ".*Week.*"
    selected: true
- tapOn: "Day"
- assertVisible:
    text: ".*Day.*"
    selected: true
- assertNotVisible:
    text: ".*Week.*"
    selected: true
- tapOn: "Month"
- assertVisible:
    text: ".*Month.*"
    selected: true
