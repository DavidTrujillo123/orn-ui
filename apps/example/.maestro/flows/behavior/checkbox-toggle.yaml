# Checkbox exposes accessibilityLabel = label directly (without duplicating
# it like Input): "Accept terms" is a single match, a plain tapOn is enough.
#
# Maestro's `checked:` selector doesn't work here — tested live: for this
# custom checkbox (TouchableOpacity + accessibilityState, not a native
# control) the iOS driver's "checked" attribute stays "false" no matter what;
# VoiceOver's real state shows up as text in the "value" field
# ("checkbox, checked" / "checkbox, unchecked"), so that's what we check.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "atoms"
      SLUG: "checkbox"
      TITLE: "Checkbox"

- assertVisible:
    text: ".*checkbox, unchecked.*"
- tapOn: "Accept terms"
- assertVisible:
    text: ".*checkbox, checked.*"
- tapOn: "Accept terms"
- assertVisible:
    text: ".*checkbox, unchecked.*"
