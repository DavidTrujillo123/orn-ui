# canGoNext gates each step's progress — without it, an incomplete form could
# "finish" the wizard without valid data (see Wizard.tsx: the Next/Finish
# button gets disabled={!canGoNext} and the underlying Pressable ignores
# onPress while disabled). This flow enters the "Per-step validation
# (canGoNext)" variant and confirms, step by step, that tapping the disabled
# button does NOT advance — not just that the button exists.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
# Straight to the validation variant (4th) by deep link: three pager swipes
# didn't always land on it.
- launchApp
- openLink: "ornui:///organisms/wizard?v=4"
- assertVisible: "Wizard"

- tapOn: "Continue"
- assertVisible: "you@example.com"
- tapOn: "you@example.com"
- inputText: "buyer@orn-ui.dev"
# hideKeyboard fails here ("no dismiss action"): the Input doesn't force
# keyboardType="email-address", so the keyboard comes with a suggestions bar
# and no dismiss key. Confirmed live (twice): without closing the keyboard
# somehow, tapOn "Continue" doesn't hit the real button — the suggestions bar
# covers the footer and the tap misses (once it even inserted an
# autocorrect suggestion into the email). pressKey Enter fires the default
# returnKeyType ("done") and closes the keyboard without relying on the hide
# button this keyboard doesn't have.
- pressKey: Enter
- tapOn: "Continue"

# "Plan" step: Continue disabled with no selection. Unlike
# select-pick-option.yaml (same pattern but without `required`), here the
# standalone label merges with the asterisk into a single "Plan *" node —
# confirmed with the hierarchy dump: the only node with accessibilityText
# exactly "Plan" (no index) is the real trigger, there's no ambiguity to break.
# The required Select is named "Plan, required" for screen readers.
- assertVisible: "Plan, required"
- tapOn: "Continue"
- tapOn: "Plan, required"
- tapOn: "Free"
- tapOn: "Continue"

# "Confirm" step: Create account (finishLabel) disabled without accepting the
# terms. Tapping it without checking the checkbox must not fire onFinish — the
# unchecked checkbox is still visible (same selector as checkbox-toggle.yaml).
- assertVisible: "Create account"
- tapOn: "Create account"
- assertVisible: ".*checkbox, unchecked.*"
- tapOn: "I accept the terms"
- assertVisible: ".*checkbox, checked.*"
