# What a render test can't see: Timeline is pure layout. Jest confirms which
# column of the tree each pill lands in, but not that the column actually ends
# up on one side or the other of the line on screen, nor that the curve —which
# shifts the whole row with a translateX— leaves the pill inside the box
# instead of clipping it against the edge. Those are pixels, and only the
# device has them.
#
# The asserts use `leftOf`/`rightOf` against the center of the screen, which
# is where the line's axis runs: it's the way to assert "alternates sides"
# without depending on exact coordinates, which change with the phone's width.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "timeline"
      TITLE: "Timeline"

# 1 — by default the first pill goes to the right of the axis and the second
# to the left.
- assertVisible:
    text: "Zero dependencies"
    rightOf:
      point: "50%,50%"
- assertVisible:
    text: "Expo SDK"
    leftOf:
      point: "50%,50%"
- assertVisible:
    text: "WCAG AA palettes"
    rightOf:
      point: "50%,50%"
# Pending milestones are just as legible as completed ones: what changes is
# the node and the line, not legibility.
- assertVisible: "Android runs"
- assertVisible: "v1.0 release"

# 2 — onItemPress: tapping a milestone brings the line up to it. What travels
# are pixels and an assert can't see them, so what we look at is the echo the
# demo prints: if the tap hadn't reached the pill, it would still say the
# previous milestone.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
#
# The taps go by `id` and not by text: targeting the text, Maestro considers
# the tap done and the state doesn't change — the node it finds isn't the
# Pressable. With the pill's testID the tap always gets through.
- assertVisible: "Reached: Expo SDK 54–57"
- tapOn:
    id: "timeline-tap-press-4"
- waitForAnimationToEnd
- assertVisible: "Reached: v1.0 release"
# Tapping the reached milestone again goes back: the line has to be able to
# move backward, not just forward.
- tapOn:
    id: "timeline-tap-press-4"
- waitForAnimationToEnd
- assertVisible: "Reached: Android device runs"

# 3 — advance="sequential": only the next milestone responds. Tapping one
# further ahead does nothing, and neither does tapping one already reached:
# progress is strict and doesn't go back.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-3"
- waitForAnimationToEnd
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-0"
- waitForAnimationToEnd
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-1"
- waitForAnimationToEnd
- assertVisible: 'Only "WCAG AA palettes" answers'

# 4 — advance="revisit": tapping backward moves the focus, not the path. It's
# what jest can't assert: that the two things look different at the same
# time on the same screen.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Looking at: WCAG AA palettes"
- assertVisible: "Progress stays at: WCAG AA palettes"
- tapOn:
    id: "timeline-revisit-press-0"
- waitForAnimationToEnd
- assertVisible: "Looking at: Zero dependencies"
- assertVisible: "Progress stays at: WCAG AA palettes"
# And the one following the path does push it forward.
- tapOn:
    id: "timeline-revisit-press-3"
- waitForAnimationToEnd
- assertVisible: "Progress stays at: Android device runs"

# 5 — advances on its own. It's left running and we wait for the echo to
# change: that proves the interval really moves the path, not that it got
# stuck on the first milestone.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- extendedWaitUntil:
    visible: "Now at: WCAG AA palettes"
    timeout: 8000

# 6 — curve={0}: the axis is straight and the alternation stays the same.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible:
    text: "Harness"
    rightOf:
      point: "50%,50%"
- assertVisible:
    text: "Coverage gate"
    leftOf:
      point: "50%,50%"

# 7 — startSide="left" flips the start, with a wider curve.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible:
    text: "Harness"
    leftOf:
      point: "50%,50%"
- assertVisible:
    text: "Coverage gate"
    rightOf:
      point: "50%,50%"

# 8 — no halo.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Zero dependencies"
- assertVisible: "v1.0 release"

# 9 — squeezed inside a Card: with less height per row the pills don't
# overlap each other.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Harness"
- assertVisible: "Publish to npm"

# 10 — a single milestone: there's no span, so there's no line to draw.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Atomic design"
