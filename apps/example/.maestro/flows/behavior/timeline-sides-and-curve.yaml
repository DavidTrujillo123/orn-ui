# Lo que un render test no puede ver: Timeline es puro layout. Jest confirma en
# qué columna del árbol cae cada píldora, pero no que esa columna termine
# realmente de un lado u otro de la línea en pantalla, ni que la curva —que
# corre la fila entera con un translateX— deje la píldora adentro de la caja en
# vez de cortarla contra el borde. Eso son píxeles, y sólo el dispositivo los
# tiene.
#
# Los asserts usan `leftOf`/`rightOf` contra el centro de la pantalla, que es
# por donde pasa el eje de la línea: es la forma de afirmar "alterna de lado"
# sin depender de coordenadas exactas, que cambian con el ancho del teléfono.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "timeline"
      TITLE: "Timeline"

# 1 — por defecto la primera píldora va a la derecha del eje y la segunda a la
# izquierda.
- assertVisible:
    text: "Zero dependencies"
    rightOf:
      point: "50%,50%"
- assertVisible:
    text: "Expo SDK 54–57"
    leftOf:
      point: "50%,50%"
- assertVisible:
    text: "WCAG AA palettes"
    rightOf:
      point: "50%,50%"
# Los hitos pendientes se ven igual de bien que los cumplidos: lo que cambia es
# el nodo y la línea, no la legibilidad.
- assertVisible: "Android device runs"
- assertVisible: "v1.0 release"

# 2 — onItemPress: tocar un hito lleva la línea hasta ahí. Lo que viaja son
# píxeles y un assert no los ve, así que lo que se mira es el eco que el demo
# imprime: si el tap no hubiera llegado a la píldora, seguiría diciendo el
# hito anterior.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
#
# Los taps van por `id` y no por texto: apuntando al texto, Maestro da el tap
# por hecho y el estado no cambia — el nodo que encuentra no es el Pressable.
# Con el testID de la píldora el tap llega siempre.
- assertVisible: "Reached: Expo SDK 54–57"
- tapOn:
    id: "timeline-tap-press-4"
- waitForAnimationToEnd
- assertVisible: "Reached: v1.0 release"
# Volver a tocar el hito alcanzado da marcha atrás: la línea tiene que poder
# retroceder, no sólo avanzar.
- tapOn:
    id: "timeline-tap-press-4"
- waitForAnimationToEnd
- assertVisible: "Reached: Android device runs"

# 3 — advance="sequential": sólo responde el hito que sigue. Tocar uno más
# adelante no hace nada, y tocar uno ya alcanzado tampoco: el avance es
# estricto y no se devuelve.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-3"
- waitForAnimationToEnd
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-0"
- waitForAnimationToEnd
- assertVisible: 'Only "Expo SDK 54–57" answers'
- tapOn:
    id: "timeline-seq-press-1"
- waitForAnimationToEnd
- assertVisible: 'Only "WCAG AA palettes" answers'

# 4 — advance="revisit": tocar para atrás mueve el foco, no el recorrido. Es
# lo que jest no puede afirmar: que las dos cosas se ven distintas al mismo
# tiempo en la misma pantalla.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Looking at: WCAG AA palettes"
- assertVisible: "Progress stays at: WCAG AA palettes"
- tapOn:
    id: "timeline-revisit-press-0"
- waitForAnimationToEnd
- assertVisible: "Looking at: Zero dependencies"
- assertVisible: "Progress stays at: WCAG AA palettes"
# Y el que sigue al recorrido sí lo empuja.
- tapOn:
    id: "timeline-revisit-press-3"
- waitForAnimationToEnd
- assertVisible: "Progress stays at: Android device runs"

# 5 — avanza solo. Se lo deja correr y se espera a que el eco cambie: eso
# prueba que el intervalo mueve el recorrido de verdad, no que quedó pegado en
# el primer hito.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- extendedWaitUntil:
    visible: "Now at: WCAG AA palettes"
    timeout: 8000

# 6 — curve={0}: el eje es recto y la alternancia sigue igual.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible:
    text: "Harness"
    rightOf:
      point: "50%,50%"
- assertVisible:
    text: "Coverage gate"
    leftOf:
      point: "50%,50%"

# 7 — startSide="left" da vuelta el arranque, con una curva más ancha.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible:
    text: "Harness"
    leftOf:
      point: "50%,50%"
- assertVisible:
    text: "Coverage gate"
    rightOf:
      point: "50%,50%"

# 8 — sin halo.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Zero dependencies"
- assertVisible: "v1.0 release"

# 9 — apretada adentro de un Card: con menos alto por fila las píldoras no se
# pisan entre sí.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Harness"
- assertVisible: "Publish to npm"

# 10 — un solo hito: no hay vano, así que no hay línea que dibujar.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Atomic design"
