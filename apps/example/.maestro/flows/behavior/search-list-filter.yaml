# SearchList's filtering lives outside the component (the demo does
# ALL.filter(...) and passes the result as `data`) — SearchList only exposes
# the input and renders what it receives. This flow confirms that the
# search -> filter -> list wiring works end to end, and that clearing the
# search (the Input's "x" button, rightIconName when there's text) restores the
# full list — a generic smoke test only opens the demo, it never types anything.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "search-list"
      TITLE: "SearchList"

- assertVisible: "Apple"
- assertVisible: "Banana"
- tapOn: "Search..."
- inputText: "ban"
- assertVisible: "Banana"
- assertNotVisible: "Apple"

# "x" button (rightIconName="close", accessibilityLabel="Clear" — see
# Input.tsx) only appears with text and clears the field.
- tapOn: "Clear"
- assertVisible: "Apple"
- assertVisible: "Banana"
