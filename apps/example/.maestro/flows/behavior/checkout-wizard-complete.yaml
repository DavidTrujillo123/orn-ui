# CheckoutWizardExample combines Wizard + DateField + OptionCard in a real
# screen (not the isolated variant catalog wizard-step-validation.yaml already
# covers). This flow walks through the 4 steps to the end to confirm the
# integration between components works together — each one already has its
# own smoke/behavior test, this tests the wiring between them (each step's
# canGoNext reading the form's real state, not a mock).
#
# It is also, unintentionally, the only reliable test of the DateField <->
# DatePicker sync: there was a date-field-pick-day.yaml testing the same thing
# in isolation in the DatePicker demo, but it needed 6 next-variant.yaml in a
# row to reach the right variant, and VariantList's pager isn't
# deterministic at that distance — confirmed live with screenshots: 6
# calibrated swipes (the same ones next-variant.yaml uses) landed on variant 5
# once, not 6. That file was deleted instead of patching it further: here no
# pager is needed, DateField lives directly on the screen.
#
# The day is picked by navigating one month ahead ("Next month") and tapping
# the 10th, not a fixed day of the current month: minDate=today makes any
# already past day of the visible month disabled, and a whole full month is
# always within minDate/maxDate (maxDate = today + 2 months) whatever day the
# test runs on.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "examples"
      SLUG: "checkout-wizard"
      TITLE: "Checkout wizard"

# Paso 1 — Contact
- tapOn: "you@example.com"
- inputText: "buyer@orn-ui.dev"
- hideKeyboard
- tapOn: "Next"

# Step 2 — Delivery (Input + DateField). The Address Input, unlike the Email
# one, doesn't force keyboardType — same problem as
# wizard-step-validation.yaml: hideKeyboard finds no dismiss key on that
# keyboard. pressKey Enter instead (confirmed live).
- tapOn: "221B Baker Street"
- inputText: "742 Evergreen Terrace"
- pressKey: Enter
- tapOn: "Delivery date"
- assertVisible: "Select date"
- tapOn: "Next month"
- tapOn: ".* 10, .*"
- assertNotVisible: "Select date"
- tapOn: "Next"

# Step 3 — Payment (OptionCard, accessibilityLabel = label directly, not
# duplicated — see OptionCard.tsx)
- tapOn: "Cash"
- tapOn: "Next"

# Step 4 — Review: KeyValueRow reflects what was entered in the previous steps.
- assertVisible: "buyer@orn-ui.dev"
- assertVisible: "742 Evergreen Terrace"
- assertVisible: "cash"
- tapOn: "I accept the terms"
- tapOn: "Place order"
- assertVisible: "Order placed"
