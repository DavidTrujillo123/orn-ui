# Walks through the demo's six variants, one per pager page.
#
# What a render test can't see: ShinyText doesn't render a <Text>, but two
# nodes per letter inside a View with `accessible`. Jest confirms the
# `accessibilityLabel` prop; only the device confirms the system merges those
# nodes into one and that the phrase is still a searchable string — if the
# merge didn't happen, Maestro would see "D", "e", "f"... and not the text.
#
# Each variant has its own text precisely for this: with two pages saying the
# same thing, a swipe that falls short would go unnoticed because the assert
# would keep finding the previous page's text.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "atoms"
      SLUG: "shiny-text"
      TITLE: "ShinyText"

# 1 — both color pairs coexist on the same page.
- assertVisible: "Default pair"
- assertVisible: "Maximum contrast"

# The sweep is an infinite loop: waitForAnimationToEnd is no use as an anchor here.
# The text still being visible after a full cycle (2400ms + 600 of pause)
# proves no letter gets stuck at opacity 0 between rounds.
- extendedWaitUntil:
    visible: "Default pair"
    timeout: 4000

# 2 — word wrap: the long phrase has to appear in full.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "A headline long enough to wrap onto more than one line"

# 3 — narrow and wide spread, two instances animating at once.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Narrow glint"
- assertVisible: "Soft wide wave"

# 4 — duration 4000 / delay 1200: the slowest cycle in the demo.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Taking its time"
- extendedWaitUntil:
    visible: "Taking its time"
    timeout: 6000

# 5 — animated={false}: a single flat <Text>, not the per-letter tree.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "No sweep at all"

# 6 — inside a Card, with the brand accent.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Pro plan"
- assertVisible: "Unlimited invoices · priority support"
