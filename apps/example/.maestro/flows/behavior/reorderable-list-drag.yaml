# Specific regression: on iOS the UIScrollView of the pager wrapping the demo
# stole the gesture from the row as soon as the vertical drag started, and
# the drag died after a few pixels instead of reordering (see the commit with
# the ReorderableList iOS fix: onPanResponderTerminationRequest +
# onDragStart/End to block the parent scroll). If that responder negotiation
# breaks, dragging "Design review" down moves the pager's *page* instead of
# the row, and the order below doesn't change — which is exactly what this
# relative position assertion detects.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "reorderable-list"
      TITLE: "ReorderableList"

# Orden inicial: Design review, Write tests, Ship release, Update docs.
- assertVisible:
    text: "Write tests"
    below: "Design review"

- swipe:
    from:
      text: "Design review"
    direction: DOWN
    duration: 600

# If the drag won (and not the pager's scroll), "Design review" moved down at
# least one row.
- assertVisible:
    text: "Design review"
    below: "Write tests"
