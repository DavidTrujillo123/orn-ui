# Tests the global header's ThemeToggle (tabs), not the organism's isolated
# demo — organisms-theme-toggle.yaml (generated smoke) already covers that.
#
# Past regression: `mode` is the provider's *controlled* prop — without
# `onModeChange` wired, ThemeToggle called setMode and the theme never
# changed (only the system toggle worked). Switching tabs and coming back also
# confirms the mode survives a screen remount, not just the first tap.
#
# Maestro's text selector requires a full string match, not a substring:
# each iOS tab exposes accessibilityText "Atoms, tab, 2 of 5" (not just
# "Atoms"). That's why the tab is tapped with `.*Atoms.*` and "I got there" is
# confirmed against the category header (standalone Title, not grouped), not
# against a list row (those concatenate title + description in a single
# accessible node and a bare "Typography" doesn't match that full string).
#
# The first assert uses extendedWaitUntil and not assertVisible: this is the
# only flow that starts on the tabs screen without an `openLink` in between
# (the others go through subflows/open-demo.yaml, and that step already gives
# the bundle time to start). With a bare assertVisible, on a cold start of a
# Release build the hierarchy is still empty when the assert runs and the
# flow fails intermittently against a blank screen.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- launchApp
- extendedWaitUntil:
    visible: "Atoms"
    timeout: 20000
- tapOn: "Dark"
- tapOn: ".*Molecules.*"
- assertVisible: "Molecules"
- tapOn: ".*Atoms.*"
- assertVisible: "Atoms"
- tapOn: "Light"
