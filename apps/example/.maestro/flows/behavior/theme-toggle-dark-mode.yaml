# Prueba el ThemeToggle del header global (tabs), no el demo aislado del
# organismo — ese ya lo cubre organisms-theme-toggle.yaml (smoke generado).
#
# Regresión pasada: `mode` es la prop *controlada* del provider — sin
# `onModeChange` cableado, ThemeToggle llamaba a setMode y el tema nunca
# cambiaba (sólo servía el toggle del sistema). Cambiar de tab y volver
# confirma además que el modo sobrevive a un remount de pantalla, no sólo al
# primer tap.
#
# El selector de texto de Maestro exige coincidencia completa del string, no
# substring: cada tab de iOS expone accessibilityText "Atoms, tab, 2 of 5"
# (no "Atoms" a secas). Por eso el tab se toca con `.*Atoms.*` y "llegué" se
# confirma contra el header de la categoría (Title suelto, sin agrupar), no
# contra una fila de la lista (esas concatenan título + descripción en un solo
# nodo accesible y "Typography" a secas no matchea ese string completo).
#
# El primer assert va con extendedWaitUntil y no con assertVisible: este es el
# único flow que arranca en la pantalla de tabs sin un `openLink` en el medio
# (los demás pasan por subflows/open-demo.yaml, y ese paso ya le da al bundle
# el tiempo de arrancar). Con assertVisible pelado, en un arranque en frío de
# un build Release la jerarquía todavía está vacía cuando corre el assert y el
# flow falla intermitente contra una pantalla en blanco.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- launchApp
- extendedWaitUntil:
    visible: "Atoms"
    timeout: 20000
- tapOn: "Dark"
- tapOn: ".*Molecules.*"
- assertVisible: "Molecules"
- tapOn: ".*Atoms.*"
- assertVisible: "Atoms"
- tapOn: "Light"
