# Slides is all position and gesture: which page ended up framed, whether
# autoPlay advances on its own, whether the background gradient keeps the
# touches meant for a button on the slide. Jest sees none of that — there all
# three pages exist in the tree at once and none has coordinates.
#
# The indicators are tapped by `id` and not by their accessibilityLabel
# ("Slide 2 of 3"): VariantList keeps the neighboring variant mounted, so that
# label exists several times in the tree at the same time. Each <Slides> in
# the demo has its own testID and a unique id per indicator comes from it.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "slides"
      TITLE: "Slides"

# ── variant 1: autoPlay + loop ─────────────────────────────────────────────
# The three assertions in order are the proof of the cycle: each one waits
# for the next slide to appear without touching anything, and the last one
# returns to the first — meaning the tail clone closed the loop without rewinding.
- assertVisible: "Zero dependencies"
- extendedWaitUntil:
    visible: "Light and dark"
    timeout: 8000
- extendedWaitUntil:
    visible: "Expo SDK 54-57"
    timeout: 8000
- extendedWaitUntil:
    visible: "Zero dependencies"
    timeout: 8000

# ── variant 2: numbered indicators, finite ─────────────────────────────────
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "numbered indicators · flat colors · finite · button inside"

- tapOn:
    id: "slides-numbers-indicator-2"
- assertVisible: "Expo SDK 54-57"
- tapOn:
    id: "slides-numbers-indicator-0"
- assertVisible: "Zero dependencies"

# Swipe the slide, not the indicator: the horizontal gesture has to be kept by
# the carousel and not by VariantList's vertical pager wrapping it.
#
# The gesture line goes through the title (45%), not the middle of the slide:
# at 55% it brushes the "Got it" button and the press keeps the responder. And
# the swipe is long and fast (70% of the width in 250 ms) because with
# 60%/400 ms the velocity wasn't always enough for `pagingEnabled` to jump a
# page — measured, 5 out of 5 with these numbers.
- swipe:
    start: "85%,45%"
    end: "15%,45%"
    duration: 250
# extendedWaitUntil and not assertVisible: `pagingEnabled`'s snap is an
# animation, and the assertion can land with the incoming slide still halfway
# in. Waiting for it to finish weakens nothing — it has to appear anyway.
- extendedWaitUntil:
    visible: "Light and dark"
    timeout: 5000

# The background (gradient or flat color) is painted with pointerEvents="none":
# if that breaks, the button is still visible but stops receiving the touch.
- tapOn:
    id: "slides-button-2"
- assertVisible: "pressed: Light and dark"

# ── variant 3: vertical orientation ────────────────────────────────────────
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "vertical orientation"

- tapOn:
    id: "slides-vertical-indicator-2"
- assertVisible: "Expo SDK 54-57"

# The slide's vertical gesture competes with VariantList's vertical pager,
# which wraps it: if the carousel doesn't keep it, this ends up on the next
# variant instead of the next slide.
- tapOn:
    id: "slides-vertical-indicator-0"
- assertVisible: "Zero dependencies"
- swipe:
    start: "50%,68%"
    end: "50%,44%"
    duration: 300
- extendedWaitUntil:
    visible: "Light and dark"
    timeout: 5000
