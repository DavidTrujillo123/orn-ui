# SignInExample is the only demo that exercises a real form's error path: it
# validates on submit (not on every keystroke), and separates the field error
# (below the Input) from the credentials error (Alert). A generic smoke test
# only opens the screen — it doesn't type anything or confirm that
# validate()/handleSubmit actually block or let through.
#
# The wrong-credentials path (Alert) isn't tested here: same problem
# alert-confirm.yaml documents — the Alert's button ends up in a single
# accessibility node merged with the backdrop, there's no stable selector by
# text. The field validation + success path already covers the real
# integration (Input <-> state <-> Button loading) without that fragility.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "examples"
      SLUG: "sign-in"
      TITLE: "Sign in"

# The text "Sign in" appears 3 times (the demo's title, the card's Title and
# the Button) — confirmed live: tapOn without disambiguation tapped the title,
# not the button, and never fired submit. The Button is the only "Sign in"
# below the checkbox.
#
# Empty submit: validate() stops before setSubmitting — no loading, both
# field errors appear.
- tapOn:
    text: "Sign in"
    below: "Keep me signed in"
- assertVisible: "Enter a valid email address"
- assertVisible: "At least 6 characters"

# Valid credentials (VALID in SignInExample.tsx): setSubmitting -> 1200ms
# of loading on the Button -> success screen.
- tapOn: "you@example.com"
- inputText: "acme@studio.com"
# Password doesn't force keyboardType (isPassword only enables secureTextEntry) —
# same problem as the email Input in wizard-step-validation.yaml:
# hideKeyboard sometimes fails there ("no dismiss action"). pressKey Enter
# instead (confirmed live).
- tapOn: "••••••"
- inputText: "orn-ui"
- pressKey: Enter
- tapOn:
    text: "Sign in"
    below: "Keep me signed in"

# waitForAnimationToEnd covers the Button's loading (1200ms simulated in
# handleSubmit) before looking at anything.
- waitForAnimationToEnd

# The iOS simulator offers to save the password to Keychain as soon as the
# submit succeeds — a system dialog, not the app's, covers "You are in"
# (confirmed live). It has to be dismissed BEFORE looking at the success
# text, otherwise extendedWaitUntil runs out the timeout with the dialog
# covering everything. "Ahora no"/"Not Now" depending on the simulator's
# locale; each block is optional (when: visible) because on a simulator with
# Keychain disabled it never shows up.
- runFlow:
    when:
      visible: "Ahora no"
    commands:
      - tapOn: "Ahora no"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

- assertVisible: "You are in"

# "Keep me signed in" is checked by default (value=true) — the success copy
# depends on that state, it isn't fixed.
- assertVisible: "This device will stay signed in."

# Sign out returns to the form and clears the password (doesn't keep it in memory).
- tapOn: "Sign out"
- assertVisible: "you@example.com"
