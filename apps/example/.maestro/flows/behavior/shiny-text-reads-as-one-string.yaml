# Lo que un render test no puede ver: ShinyText no renderiza un <Text>, sino
# dos nodos por letra dentro de un View con `accessible`. Jest confirma el prop
# `accessibilityLabel`; sólo el dispositivo confirma que el sistema fusiona
# esos nodos en uno solo y que la frase sigue siendo un string buscable —
# si la fusión no ocurriera, Maestro vería "S", "h", "i"... y no el título.
#
# La segunda variante además prueba el layout: row + flexWrap parte por
# palabra, no por letra. Una frase larga tiene que aparecer entera y con las
# palabras intactas; con wrap por carácter el texto seguiría "visible" para
# jest pero ilegible en pantalla.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "atoms"
      SLUG: "shiny-text"
      TITLE: "ShinyText"

- assertVisible: "Shiny Text"

# El barrido es un loop infinito: waitForAnimationToEnd no sirve de ancla acá.
# Que el mismo texto siga visible después de un ciclo completo (2400ms + 600 de
# pausa) prueba que ninguna letra se queda en opacidad 0 entre vueltas.
- extendedWaitUntil:
    visible: "Shiny Text"
    timeout: 4000

- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example

- assertVisible: "A headline long enough to wrap onto more than one line"
