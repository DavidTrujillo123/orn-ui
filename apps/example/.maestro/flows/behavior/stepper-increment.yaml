# First variant only (a single Stepper): the other variants stack 2-3
# Steppers at once and "Increment"/"Decrement" would stop being a unique match.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "molecules"
      SLUG: "stepper"
      TITLE: "Stepper"

- assertVisible: "1"
- tapOn: "Increment"
- assertVisible: "2"
- tapOn: "Increment"
- assertVisible: "3"
- tapOn: "Decrement"
- assertVisible: "2"
