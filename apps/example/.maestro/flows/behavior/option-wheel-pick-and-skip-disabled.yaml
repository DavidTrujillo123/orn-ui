# Lo que un render test no puede ver: la rueda es un ScrollView anidado adentro
# del pager vertical de VariantList, o sea dos scrolls verticales compitiendo
# por el mismo gesto. Jest dispara `momentumScrollEnd` a mano y nunca prueba
# que el dedo llegue a la rueda en vez de pasar la página. Tampoco ve el snap:
# en jsdom no hay inercia, así que "soltar entre dos filas termina con una
# centrada" sólo se puede afirmar acá.
#
# Cada swipe de rueda sale de `from: { id: ... }` y no de coordenadas fijas:
# las siete variantes tienen la rueda a distinta altura (una es compacta, otra
# vive adentro de un Card con título encima), y un 52%→44% que sirve para la
# primera cae afuera en las demás.
#
# Los asserts miran el eco que cada variante imprime debajo ("Picked:",
# "Flat pick:", "Bag:"), no la fila centrada: el texto de la fila está igual de
# visible esté elegida o no, así que sólo el eco prueba que el gesto movió la
# selección. Y después de cada swipe se vuelve a afirmar un ancla de la propia
# variante, porque si el pager se quedara con el gesto y pasara de página el
# eco viejo también desaparecería y el assertNotVisible pasaría de prepo.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "option-wheel"
      TITLE: "OptionWheel"

# 1 — arranca centrada en Medium y el gesto la mueve.
- assertVisible: "Picked: Medium"
- swipe:
    from:
      id: "wheel-size-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Size"
- assertNotVisible: "Picked: Medium"

# 2 — Small y Wide están deshabilitadas: la rueda no puede quedarse en ninguna
# de las dos, se corra lo que se corra. Las etiquetas de esta variante no
# comparten prefijo justamente por esto: con 'Large' y 'X-Large' el
# assertNotVisible encuentra la una adentro de la otra y nunca falla.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Picked: Medium"
- swipe:
    from:
      id: "wheel-stock-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "In stock"
- assertNotVisible: "Picked: Small"
- assertNotVisible: "Picked: Wide"

# 3 — rueda compacta con unidad.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Reminder in 15 minutes"
- swipe:
    from:
      id: "wheel-minutes-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Remind me in"
- assertNotVisible: "Reminder in 15 minutes"

# 4 — sin inclinación: el gesto tiene que moverla igual.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Flat pick: Large"
- swipe:
    from:
      id: "wheel-flat-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "No tilt"
- assertNotVisible: "Flat pick: Large"

# 5 — deshabilitada: el mismo gesto que mueve a las demás no la mueve.
#
# Acá el swipe va corto y por coordenadas, no `from: { id: ... }` como en las
# otras seis. Con `scrollEnabled` en false el gesto no muere en la rueda: se lo
# lleva el pager, y encima con retardo. Un swipe largo pasaba de página después
# de que el assert siguiente ya hubiera pasado, y el flow terminaba dos
# variantes más adelante sin que nada fallara en el momento. Corto no le
# alcanza el impulso.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Locked on: Medium"
- swipe:
    start: "50%,56%"
    end: "50%,50%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Locked on: Medium"

# 6 — adentro de un Card.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Bag size"
- assertVisible: "Bag: Small"
- swipe:
    from:
      id: "wheel-bag-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Ships free over 2 kg"
- assertNotVisible: "Bag: Small"

# 7 — spotlight adentro de un disco: sin banda, la fila nítida es la elegida.
# El color y la forma los pone el demo, no la rueda. Se mueve igual que las
# demás.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Allocating to: Stocks"
- swipe:
    from:
      id: "wheel-bucket-scroll"
    direction: UP
- waitForAnimationToEnd
- assertNotVisible: "Allocating to: Stocks"
- assertVisible: "Allocating to: .*"
