# What a render test can't see: the wheel is a ScrollView nested inside
# VariantList's vertical pager, i.e. two vertical scrolls competing for the
# same gesture. Jest fires `momentumScrollEnd` by hand and never proves the
# finger reaches the wheel instead of turning the page. It doesn't see the
# snap either: in jsdom there is no momentum, so "releasing between two rows
# ends with one centered" can only be asserted here.
#
# Each wheel swipe starts from `from: { id: ... }` and not from fixed
# coordinates: the seven variants have the wheel at different heights (one is
# compact, another lives inside a Card with a title above), and a 52%→44%
# that works for the first lands outside in the others.
#
# The asserts look at the echo each variant prints below ("Picked:",
# "Flat pick:", "Bag:"), not at the centered row: the row's text is equally
# visible whether it's selected or not, so only the echo proves the gesture
# moved the selection. And after each swipe an anchor of the variant itself is
# asserted again, because if the pager took the gesture and turned the page,
# the old echo would also disappear and the assertNotVisible would pass by default.
appId: com.anonymous.orn-ui-example
tags:
  - behavior
---
- runFlow:
    file: ../../subflows/open-demo.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
      BASE_PATH: "organisms"
      SLUG: "option-wheel"
      TITLE: "OptionWheel"

# 1 — starts centered on Medium and the gesture moves it.
- assertVisible: "Picked: Medium"
- swipe:
    from:
      id: "wheel-size-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Size"
- assertNotVisible: "Picked: Medium"

# 2 — Small and Wide are disabled: the wheel can't stay on either of them, no
# matter how far it moves. This variant's labels don't share a prefix
# precisely because of this: with 'Large' and 'X-Large' the
# assertNotVisible finds one inside the other and never fails.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Picked: Medium"
- swipe:
    from:
      id: "wheel-stock-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "In stock"
- assertNotVisible: "Picked: Small"
- assertNotVisible: "Picked: Wide"

# 3 — compact wheel with a unit.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Reminder in 15 minutes"
- swipe:
    from:
      id: "wheel-minutes-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Remind me in"
- assertNotVisible: "Reminder in 15 minutes"

# 4 — no tilt: the gesture still has to move it.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Flat pick: Large"
- swipe:
    from:
      id: "wheel-flat-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "No tilt"
- assertNotVisible: "Flat pick: Large"

# 5 — disabled: the same gesture that moves the others doesn't move it.
#
# Here the swipe is short and by coordinates, not `from: { id: ... }` as in
# the other six. With `scrollEnabled` false the gesture doesn't die in the
# wheel: the pager takes it, and with a delay on top of that. A long swipe
# turned the page after the next assert had already passed, and the flow ended
# up two variants further along without anything failing at the time. A short
# one doesn't have enough momentum.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Locked on: Medium"
- swipe:
    start: "50%,56%"
    end: "50%,50%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Locked on: Medium"

# 6 — inside a Card.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Bag size"
- assertVisible: "Bag: Small"
- swipe:
    from:
      id: "wheel-bag-scroll"
    direction: UP
- waitForAnimationToEnd
- assertVisible: "Ships free over 2 kg"
- assertNotVisible: "Bag: Small"

# 7 — spotlight inside a disc: no band, the sharp row is the selected one.
# The color and shape come from the demo, not the wheel. It moves just like
# the others.
- runFlow:
    file: ../../subflows/next-variant.yaml
    env:
      MAESTRO_APP_ID: com.anonymous.orn-ui-example
- assertVisible: "Allocating to: Stocks"
- swipe:
    from:
      id: "wheel-bucket-scroll"
    direction: UP
- waitForAnimationToEnd
- assertNotVisible: "Allocating to: Stocks"
- assertVisible: "Allocating to: .*"
