# Clip para la doc, no un test. Ver .maestro/README.md.
appId: com.anonymous.orn-ui-example
---
- launchApp:
    clearState: true
- openLink: "ornui:///organisms/screen"
- assertVisible:
    text: "Screen"
    index: 0
- waitForAnimationToEnd:
    timeout: 1200

- startRecording: screen

# 1/5 — edges={["top","bottom"]} (default) — content clears the notch
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1200" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 2/5 — edges={[]} — the same screen without insets
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 3/5 — scrollable (default) — long content scrolls
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 4/5 — scrollable={false} — the overflow is clipped
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 5/5 — keyboard — the focused field stays visible
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }

- stopRecording
