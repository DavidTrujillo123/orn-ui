appId: com.anonymous.orn-ui-example
---
- launchApp:
    clearState: true
- openLink: "ornui:///atoms/spinner"
- assertVisible:
    text: "Spinner"
    index: 0
- waitForAnimationToEnd:
    timeout: 1200

- startRecording: spinner

# 1/7 — variant="native" (default — system ActivityIndicator)
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1200" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 2/7 — variant="dots" — custom, identical on iOS and Android
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 3/7 — variant="ring" — custom spinning ring
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }

- stopRecording
