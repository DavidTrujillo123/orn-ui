# Presentation flow (not a test): records the clip the docs show on the
# BottomSheet page.
#
# It lives outside flows/ on purpose — config.yaml only includes
# flows/**/*.yaml, so `maestro test .maestro` (i.e. e2e:ios and CI) doesn't
# run it or count it as coverage. A failing clip must not break the suite,
# and an assert here adds no signal: the sheet position regression is
# already covered by flows/behavior/bottom-sheet-position-and-dismiss.yaml.
#
# The examples start open, drawn inline in the demo box. Walks through the demo's 5 variants, one per page of VariantList's
# vertical pager. Paging goes through subflows/next-variant.yaml, the same
# one the tests use: `direction: UP` doesn't change the page and a longer
# swipe skips variants. Each variant is opened, left still for a
# beat so it can be read, and closed the way that fits it: the draggable one
# is dragged, the one with a footer is cancelled, the fixed one is closed via
# backdrop. The variant's label stays at the top of the screen, so the clip
# explains itself.
#
# startRecording only starts after the deep link: the clip begins on the
# demo's screen, with no splash or navigation.
appId: com.anonymous.orn-ui-example
---
- launchApp:
    clearState: true
- openLink: "ornui:///organisms/bottom-sheet"
- assertVisible:
    text: "BottomSheet"
    index: 0
- waitForAnimationToEnd

- startRecording: bottom-sheet

# 1 — bare: handle only. Every example starts open (inline); it closes from the
# backdrop at the top of the box before the pager moves on.
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "500" }

# 2 — title + footer: a form in a sheet. Every example starts open (inline); it closes from the
# backdrop at the top of the box before the pager moves on.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "500" }

# 3 — long content: capped at maxHeight. Every example starts open (inline); it closes from the
# backdrop at the top of the box before the pager moves on.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "500" }

# 4 — footerPlacement="hide-with-keyboard": long form. Every example starts open (inline); it closes from the
# backdrop at the top of the box before the pager moves on.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "500" }

# 5 — draggable={false}: closes from the backdrop. Every example starts open (inline); it closes from the
# backdrop at the top of the box before the pager moves on.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "500" }

- stopRecording
