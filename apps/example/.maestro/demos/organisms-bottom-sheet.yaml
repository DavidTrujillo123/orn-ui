# Presentation flow (not a test): records the clip the docs show on the
# BottomSheet page.
#
# It lives outside flows/ on purpose — config.yaml only includes
# flows/**/*.yaml, so `maestro test .maestro` (i.e. e2e:ios and CI) doesn't
# run it or count it as coverage. A failing clip must not break the suite,
# and an assert here adds no signal: the sheet position regression is
# already covered by flows/behavior/bottom-sheet-position-and-dismiss.yaml.
#
# Walks through the demo's 5 variants, one per page of VariantList's
# vertical pager. Paging goes through subflows/next-variant.yaml, the same
# one the tests use: `direction: UP` doesn't change the page and a longer
# swipe skips variants. Each variant is opened, left still for a
# beat so it can be read, and closed the way that fits it: the draggable one
# is dragged, the one with a footer is cancelled, the fixed one is closed via
# backdrop. The variant's label stays at the top of the screen, so the clip
# explains itself.
#
# startRecording only starts after the deep link: the clip begins on the
# demo's screen, with no splash or navigation.
appId: com.anonymous.orn-ui-example
---
- launchApp:
    clearState: true
- openLink: "ornui:///organisms/bottom-sheet"
- assertVisible:
    text: "BottomSheet"
    index: 0
- waitForAnimationToEnd

- startRecording: bottom-sheet

# 1 — bare: handle only. It's closed by dragging, which is the gesture that
# defines the component. Explicit coordinates (not `direction: DOWN`): in this
# variant the handle already lives near the bottom edge and you have to start
# at the very top of its hit area to pass the 100pt threshold.
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "600" }
- tapOn: "Open sheet"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1100" }
- swipe:
    start: "50%,86%"
    end: "50%,100%"
    duration: 400
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "400" }

# 2 — title + footer: a form inside the sheet. Closes via "Cancel", the
# path a footer with actions has.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- tapOn: "Add a note"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1300" }
- tapOn: "Cancel"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "400" }

# 3 — long content: the sheet caps at maxHeight and the content is cut off,
# which is what shows the cap. It doesn't scroll inside on purpose: that
# gesture dragged the sheet and left the pager shifted, and from then on the
# flow opened the wrong variant.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- tapOn: "Open long sheet"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "600" }
# Explicit point at the very top, not `tapOn: { id: bottom-sheet-backdrop }`:
# the backdrop covers the whole screen, so its center falls UNDER a tall
# sheet and the tap ends up on the content. The sheet stayed open and the
# rest of the flow ran on the wrong variant.
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "400" }

# 4 — footerPlacement="hide-with-keyboard": the long form keeps the actions
# row. Without opening the keyboard the clip shows the sheet full of fields;
# the keyboard behavior doesn't fit in a loop of a few seconds.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- tapOn: "Open long form"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1300" }
- tapOn: "Cancel"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "400" }

# 5 — draggable={false} + maxHeight={0.4}: it doesn't drag, it closes by
# tapping outside. It's the only variant where the backdrop is the main path.
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd
- tapOn: "Open fixed sheet"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1300" }
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "600" }

- stopRecording
