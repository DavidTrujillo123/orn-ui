# Deliberate pause inside a demo flow. Maestro has no sleep command
# (`sleep`/`wait` are invalid syntax — verified with check-syntax), and
# waitForAnimationToEnd returns as soon as the screen goes still, which is
# exactly the opposite of what a clip needs: the beat in which the user
# *looks at* the new state before the next action.
#
# Parameter (via runFlow -> env): MS.
appId: ${MAESTRO_APP_ID}
---
- evalScript: ${(function(){var t = Date.now(); while (Date.now() - t < Number(MS)) {} return 1})()}
