# Pausa deliberada dentro de un flow de demo. Maestro no tiene comando sleep
# (`sleep`/`wait` son sintaxis inválida — verificado con check-syntax), y
# waitForAnimationToEnd vuelve apenas la pantalla queda quieta, que es justo
# lo contrario de lo que necesita un clip: el beat en el que el usuario
# *mira* el estado nuevo antes de la siguiente acción.
#
# Parámetro (via runFlow -> env): MS.
appId: ${MAESTRO_APP_ID}
---
- evalScript: ${(function(){var t = Date.now(); while (Date.now() - t < Number(MS)) {} return 1})()}
