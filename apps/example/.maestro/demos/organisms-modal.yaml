- tapOn: "Open full"
- waitForAnimationToEnd:
    timeout: 1200
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn: "Close"
- waitForAnimationToEnd:
    timeout: 1200
- runFlow:
    file: ../subflows/next-variant.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example }
- waitForAnimationToEnd:
    timeout: 1200
# 2/3 — overlay
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "900" }
- tapOn: "Open overlay"
- waitForAnimationToEnd:
    timeout: 1200
- runFlow:
    file: _beat.yaml
    env: { MAESTRO_APP_ID: com.anonymous.orn-ui-example, MS: "1400" }
- tapOn:
