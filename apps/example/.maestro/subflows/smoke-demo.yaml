# Subflow: generic smoke test for a manifest demo.
# Parameters (via runFlow -> env): BASE_PATH, SLUG, TITLE, PAGED ("true"/"false").
#
# Deep link, not navigating tabs + tapping the row: each demo is reachable in
# one step, so the whole suite doesn't depend on the tabs, the list and the
# category scroll working — their own flows (nav-*.yaml) already cover that,
# no need to repeat it for each of the 45 demos.
#
# The generic swipe only touches VariantList's pager (PAGED=true): it goes
# through the real paging gesture once, without depending on each variant's
# text (which varies per demo). hostsList/freeScroll mount a different kind of
# scroll and are excluded — swiping there exercises nothing specific to the component.
appId: ${MAESTRO_APP_ID}
---
- launchApp
- openLink: "ornui:///${BASE_PATH}/${SLUG}"
- assertVisible:
    text: "${TITLE}"
    index: 0
- runFlow:
    when:
      true: ${PAGED}
    commands:
      - swipe:
          direction: UP
          duration: 400
      - swipe:
          direction: DOWN
          duration: 400
