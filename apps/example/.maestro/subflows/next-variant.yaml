# Subflow: advances VariantList's pager by exactly one page.
#
# `swipe: { direction: UP }` without explicit coordinates travels almost the
# whole screen and, with `pagingEnabled`, the resulting velocity is enough to
# skip a page in pagers with 3+ variants (confirmed live: a single swipe like
# that in the Modal demo landed on "fullScreen", skipping "overlay" — it
# happened with duration: 800 too). 80%→30% of the screen is short enough not
# to build up that velocity and always lands on the next page, not one more.
appId: ${MAESTRO_APP_ID}
---
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 600
