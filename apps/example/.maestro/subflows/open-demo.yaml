# Subflow: opens a demo's detail via deep link and confirms it loaded.
# Parameters (via runFlow -> env): BASE_PATH ("atoms"/"molecules"/"organisms"/"examples"),
# SLUG (the manifest slug) and TITLE (entry.name, what the detail's <Title> renders).
#
# Deep link, not navigating tabs + tapping the row: each demo is reachable in
# one step, so the whole suite doesn't depend on the tabs, the list and the
# category scroll working — their own flow already covers that, no need to
# repeat it 45 times.
appId: ${MAESTRO_APP_ID}
---
- launchApp
- openLink: "ornui:///${BASE_PATH}/${SLUG}"
- assertVisible:
    text: "${TITLE}"
    index: 0
