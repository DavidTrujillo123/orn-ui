name: CI

on:
  push:
    tags: ["*"]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check subpath exports are up to date with src/
        run: pnpm --filter orn-ui gen:exports:check

      - name: Typecheck orn-ui
        run: pnpm --filter orn-ui typecheck

      - name: Typecheck example app
        run: pnpm --filter example typecheck

      - name: Test (with coverage gate — 90% lines / 85% branches)
        run: pnpm --filter orn-ui test:coverage

      - name: Build orn-ui (commonjs + module + typescript)
        run: pnpm --filter orn-ui build

      - name: Smoke test the install CLI (installs --all into apps/example, typechecks it)
        run: pnpm --filter orn-ui test:cli

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/ui
        run: |
          npm install -g npm@latest
          npm publish --access public
