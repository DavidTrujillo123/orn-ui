name: CI

# Every push to main and every PR is checked; only a `v*` tag publishes
# (see the last step). It used to run on tags alone, so main went unverified
# until the next release.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  # One runner per supported Expo SDK: installs that SDK's exact
  # react-native/react in a sandbox and runs typecheck + tests there. This is
  # what backs the README compatibility table, and `ci` depends on this job so
  # a tag can't publish support for an SDK nobody verified.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["54", "55", "56", "57", "58"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck + test the library against Expo SDK ${{ matrix.sdk }}
        run: pnpm --filter orn-ui compat --sdk ${{ matrix.sdk }}

      # The matrix above runs the library in isolation; this runs the whole
      # example app on that SDK. It catches what a sandbox can't see: duplicate
      # copies of react/react-native/safe-area-context when the app's SDK mixes
      # with packages/ui devDependencies, and expo-router APIs that moved
      # packages between SDKs. `--export` bundles with that SDK's Hermes, so a
      # toolchain mismatch fails here too.
      - name: Typecheck + bundle apps/example on Expo SDK ${{ matrix.sdk }}
        run: |
          pnpm sdk ${{ matrix.sdk }}
          pnpm --filter example typecheck
          pnpm sdk ${{ matrix.sdk }} --export

  ci:
    runs-on: ubuntu-latest
    needs: compat
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The repo checklist (AGENTS.md): a component without test/demo/flow, a
      # stale count in a README, an import that breaks zero dependencies, an
      # atom importing an organism. Neither tsc nor jest sees any of that.
      - name: Harness (component checklist, zero deps, layers, tokens, SDK)
        run: pnpm harness

      - name: Check subpath exports are up to date with src/
        run: pnpm --filter orn-ui gen:exports:check

      - name: Check Maestro smoke flows are up to date with the demo manifest
        run: pnpm --filter example gen:maestro:check

      # The .maestro/demos/ flows aren't tests (the suite doesn't run them), but
      # they are generated from the same manifest: if someone adds a component
      # and doesn't regenerate them, its doc clip doesn't exist and nobody
      # notices until recording.
      - name: Check Maestro demo-clip flows are up to date
        run: pnpm --filter example gen:maestro:demos:check

      - name: Typecheck orn-ui
        run: pnpm --filter orn-ui typecheck

      - name: Typecheck example app
        run: pnpm --filter example typecheck

      - name: Test (with coverage gate — 90% lines / 85% branches)
        run: pnpm --filter orn-ui test:coverage

      - name: Build orn-ui (commonjs + module + typescript)
        run: pnpm --filter orn-ui build

      - name: Smoke test the install CLI (installs --all into apps/example, typechecks it)
        run: pnpm --filter orn-ui test:cli

      # A tag that doesn't match packages/ui/package.json would publish the
      # wrong version (or fail at npm with a less clear message).
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/ui version ${VERSION}" >&2
            exit 1
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/ui
        run: |
          npm install -g npm@latest
          npm publish --access public
